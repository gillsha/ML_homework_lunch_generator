<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Lunch Menu Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #ffe2e8 0%, #f8aec2 100%);
      color: #41363b;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 500px;
      padding: 36px 30px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(131, 58, 80, 0.16);
    }
    h1 {
      margin: 0 0 16px;
      color: #df655c;
      font-size: 28px;
      line-height: 1.25;
    }
    h1 i { margin-right: 6px; }
    .description {
      margin: 0;
      color: #776b70;
      font-size: 16px;
      line-height: 1.6;
    }
    .result {
      margin: 26px 0;
      padding: 28px 16px;
      min-height: 178px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      border-radius: 18px;
      background: #fff5f4;
    }
    #lunchIcon {
      display: inline-block;
      color: #ed796e;
      font-size: 52px;
      line-height: 1;
    }
    #lunchName {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    #generateBtn {
      width: 100%;
      padding: 16px 18px;
      border: none;
      border-radius: 12px;
      background: #e87569;
      color: #fff;
      font: 700 18px/1.4 Arial, Helvetica, sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(232, 117, 105, 0.28);
      transition: background 150ms, transform 150ms, box-shadow 150ms;
    }
    #generateBtn i { margin-right: 7px; }
    #generateBtn:not(:disabled):hover {
      background: #da6358;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(232, 117, 105, 0.35);
    }
    #generateBtn:not(:disabled):active { transform: translateY(0); }
    #generateBtn:focus-visible { outline: 3px solid #943e50; outline-offset: 4px; }
    #generateBtn:disabled { opacity: 0.6; cursor: wait; box-shadow: none; }
    .hint { margin: 18px 0 0; color: #887b81; font-size: 13px; line-height: 1.5; }
    .fade-in { animation: fadeIn 500ms ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 380px) {
      .card { padding: 28px 20px; }
      h1 { font-size: 25px; }
      .description { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1><i class="fas fa-utensils" aria-hidden="true"></i> Random Lunch Generator</h1>
    <p class="description">Struggling to decide what to eat? Let us choose for you with just one click!</p>
    <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true">
      <i id="lunchIcon" class="fas fa-question" aria-hidden="true"></i>
      <h2 id="lunchName">What's for lunch?</h2>
    </div>
    <button id="generateBtn" type="button"><i class="fas fa-random" aria-hidden="true"></i> Generate Lunch!</button>
    <p class="hint">Click the button again if you can't decide!</p>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const lunchMenu = [
        { name: 'Pizza', icon: 'fas fa-pizza-slice' },
        { name: 'Sushi', icon: 'fas fa-fish' },
        { name: 'Burger', icon: 'fas fa-hamburger' },
        { name: 'Salad', icon: 'fas fa-leaf' },
        { name: 'Tacos', icon: 'fas fa-hotdog' },
        { name: 'Ramen', icon: 'fas fa-bowl-food' },
        { name: 'Sandwich', icon: 'fas fa-bread-slice' },
        { name: 'Pasta', icon: 'fas fa-plate-wheat' },
        { name: 'Curry', icon: 'fas fa-mortar-pestle' },
        { name: 'Steak', icon: 'fas fa-bacon' },
        { name: 'Soup', icon: 'fas fa-bowl-food' },
        { name: 'BBQ', icon: 'fas fa-fire' }
      ];
      const generateBtn = document.getElementById('generateBtn');
      const result = document.getElementById('result');
      const lunchIcon = document.getElementById('lunchIcon');
      const lunchName = document.getElementById('lunchName');

      function generateLunch() {
        if (generateBtn.disabled) return;
        generateBtn.disabled = true;
        result.classList.remove('fade-in');
        const lunch = lunchMenu[Math.floor(Math.random() * lunchMenu.length)];
        lunchIcon.className = 'fas fa-spinner fa-spin';
        lunchName.textContent = 'Thinking...';

        setTimeout(function () {
          lunchName.textContent = lunch.name;
          lunchIcon.className = lunch.icon;
          result.classList.add('fade-in');
          generateBtn.disabled = false;
        }, 500);
      }

      generateBtn.addEventListener('click', generateLunch);
      generateLunch();
    }, { once: true });
  </script>
</body>
</html>
